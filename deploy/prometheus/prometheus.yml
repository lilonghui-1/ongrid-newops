# Prometheus 采集配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ops-agent 自监控（如暴露 /metrics）
  - job_name: "ops-agent"
    static_configs:
      - targets: ["ops-agent:8000"]
    metrics_path: /metrics

